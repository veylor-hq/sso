[tool.poetry]
name = "veylor-sso"
version = "0.1.0"
description = "Veylor SSO - Central Identity & OpenID Connect Provider for Veylor"
authors = ["Ihor Savenko <csigorek@gmail.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.12"
fastapi = ">=0.115.0"
uvicorn = {extras = ["standard"], version = ">=0.30.0"}
beanie = ">=1.26.0"
motor = ">=3.6.0"
pydantic = ">=2.8.0"
pydantic-settings = ">=2.4.0"
redis = ">=5.0.0"
argon2-cffi = ">=23.1.0"
cryptography = ">=43.0.0"
pyjwt = {extras = ["crypto"], version = ">=2.9.0"}
jinja2 = ">=3.1.4"
python-multipart = ">=0.0.9"
aiosmtplib = ">=3.0.0"
ulid-py = ">=1.1.0"
httpx = ">=0.27.0"
email-validator = ">=2.2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
pytest-asyncio = ">=0.24.0"
fakeredis = ">=2.24.0"
mongomock-motor = ">=0.0.33"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
