name: Build & Deploy Veylor SSO

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Notify Task Processed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        run: |
          ./scripts/notify_telegram.sh processing "Veylor SSO" "Build & deployment process initiated on GitHub Actions."

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.KAMAL_REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: string
        run: |
          echo "repo_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.string.outputs.repo_name }}/veylor-sso:latest
            ghcr.io/${{ steps.string.outputs.repo_name }}/veylor-sso:${{ github.sha }}
            ghcr.io/${{ steps.string.outputs.repo_name }}:latest
            ghcr.io/${{ steps.string.outputs.repo_name }}:${{ github.sha }}
          labels: |
            service=veylor-sso
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Queued for Deploy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        run: |
          ./scripts/notify_telegram.sh queued "Veylor SSO" "Docker image built & pushed to GHCR. Queued for Kamal deploy."

      - name: Install Ruby & Kamal
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Kamal
        run: gem install kamal -v 2.4.0

      - name: Deploy Veylor SSO via Kamal
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
          SSH_PRIVATE_KEY: ${{ secrets.KAMAL_SSH_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          TARGET_SERVER_IP: ${{ secrets.TARGET_SERVER_IP }}
          SERVICE_NAME: "Veylor SSO"
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/kamal_ci_key
          chmod 600 ~/.ssh/id_rsa ~/.ssh/kamal_ci_key

          cat << 'EOF' > ~/.ssh/config
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

          if [ ! -f .server.env ] && [ -n "$TARGET_SERVER_IP" ]; then
            ssh kamal@$TARGET_SERVER_IP "cat .kamal/apps/veylor-sso/env/roles/web.env 2>/dev/null" > .server.env || true
          fi

          mkdir -p .kamal
          python3 -c 'import os
          print("KAMAL_REGISTRY_PASSWORD=" + os.environ.get("KAMAL_REGISTRY_PASSWORD", ""))
          for sec in ["SECRET_KEY", "ADMIN_API_KEY", "SMTP_HOST", "SMTP_PORT", "SMTP_USERNAME", "SMTP_PASSWORD"]:
              val = os.environ.get(sec)
              if val:
                  print(f"{sec}={val}")
          if os.path.exists(".server.env"):
              for line in open(".server.env"):
                  line = line.strip()
                  if line and not line.startswith("#") and "=" in line:
                      k, v = line.split("=", 1)
                      print(k.strip() + "=" + v.strip())' > .kamal/secrets

          kamal deploy -c config/deploy.yml --version ${{ github.sha }} --skip-push

      - name: Notify Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        run: |
          ./scripts/notify_telegram.sh failure "Veylor SSO" "Build or deployment failed on GitHub Actions."
