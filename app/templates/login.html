{% extends "base.html" %} {% block title %}Authentication - Veylor SSO{%
endblock %} {% block content %}
<div class="w-full max-w-md bg-[#161616] border border-[#333333] p-8">
  <div class="mb-8">
    <div
      class="inline-flex items-center gap-2 border border-[#333333] bg-[#1a1a1a] px-2.5 py-1 text-[11px] font-mono text-[#a1a1aa] uppercase tracking-widest mb-4"
    >
      <span class="h-1.5 w-1.5 bg-[#fafafa]"></span>
      Access Gateway
    </div>
    <h1 class="text-xl font-bold tracking-tight text-[#fafafa] uppercase">
      Sign In to Veylor
    </h1>
    <p class="text-xs text-[#a1a1aa] mt-1 font-mono">
      Single Sign-On for Veylor-wide services
    </p>
  </div>

  {% if error %}
  <div
    class="mb-6 p-3 bg-[#1c1111] border border-[#7f1d1d] text-xs font-mono text-[#fca5a5]"
  >
    [ERROR] {{ error }}
  </div>
  {% endif %}

  <form method="POST" action="/login" class="space-y-5">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <input type="hidden" name="return_to" value="{{ return_to }}" />

    <div>
      <label
        for="email"
        class="block text-[11px] font-mono text-[#a1a1aa] uppercase tracking-wider mb-1.5"
        >User Email</label
      >
      <input
        type="email"
        id="email"
        name="email"
        value="{{ email or '' }}"
        required
        autofocus
        class="w-full px-3.5 py-2.5 bg-[#111111] border border-[#333333] text-[#fafafa] placeholder-[#52525b] text-sm focus:border-[#fafafa]"
      />
    </div>

    <div>
      <div class="flex items-center justify-between mb-1.5">
        <label
          for="password"
          class="block text-[11px] font-mono text-[#a1a1aa] uppercase tracking-wider"
          >Password</label
        >
        <a
          href="/forgot-password"
          class="text-[11px] font-mono text-[#71717a] hover:text-[#fafafa] transition uppercase tracking-wider"
          >Recovery &rarr;</a
        >
      </div>
      <input
        type="password"
        id="password"
        name="password"
        required
        class="w-full px-3.5 py-2.5 bg-[#111111] border border-[#333333] text-[#fafafa] placeholder-[#52525b] text-sm focus:border-[#fafafa]"
      />
    </div>

    <button type="submit" class="btn-veylor-primary w-full py-3 px-4">
      Authenticate
    </button>
  </form>

  <div
    class="mt-8 pt-6 border-t border-[#262626] flex items-center justify-between text-[11px] font-mono text-[#71717a] uppercase"
  >
    <span>No Veylor account?</span>
    <a
      href="/register{% if return_to %}?return_to={{ return_to }}{% endif %}"
      class="text-[#fafafa] hover:underline font-medium"
    >
      Create Account &rarr;
    </a>
  </div>
</div>
{% endblock %}
